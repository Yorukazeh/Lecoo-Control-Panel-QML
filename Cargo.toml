[package]
name = "Lecoo-Control-Panel-QML"
version = "0.3.1"
edition = "2024"
authors = ["Yorukazeh"]
description = "Material 3 QML control center for Lecoo/Emdoor laptops (IT5570/IT5571 EC)."
repository = "https://github.com/Yorukazeh/Lecoo-Control-Panel-QML"
license = "GPL-3.0-only"
readme = "README.md"
keywords = ["lecoo", "emdoor", "ec", "qt", "qml", "material3"]
categories = ["gui", "hardware-support"]

[[bin]]
name = "Lecoo-Control-Panel-QML"
path = "src/main.rs"

[dependencies]
cxx = "1.0"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_full"] }
ipc = { git = "https://github.com/LaVashikk/Lecoo-Control-Center", rev = "e0847b6d156401ab7d75ba9b2995633fd5fc0e90" }
lecoo-types = { git = "https://github.com/LaVashikk/Lecoo-Control-Center", rev = "e0847b6d156401ab7d75ba9b2995633fd5fc0e90" }

[build-dependencies]
cxx-qt-build = "0.10"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[features]
link_qt_object_files = ["cxx-qt-build/link_qt_object_files"]
